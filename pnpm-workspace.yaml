packages:
  - apps/*

# Scripts de instalação bloqueados. Os do Carbon e do IBM Plex só rodam
# telemetria (ibmtelemetry); o do @parcel/watcher compila do código-fonte quando
# não há binário pronto, o que não é o caso nas plataformas usadas.
allowBuilds:
  sharp: false
  unrs-resolver: false
  "@parcel/watcher": false
  "@carbon/charts": false
  "@carbon/charts-react": false
  "@carbon/colors": false
  "@carbon/feature-flags": false
  "@carbon/grid": false
  "@carbon/icon-helpers": false
  "@carbon/icons-react": false
  "@carbon/layout": false
  "@carbon/motion": false
  "@carbon/react": false
  "@carbon/styles": false
  "@carbon/themes": false
  "@carbon/type": false
  "@carbon/utilities": false
  "@carbon/utils-position": false
  "@ibm/plex": false
  "@ibm/plex-mono": false
  "@ibm/plex-sans": false
  "@ibm/plex-sans-arabic": false
  "@ibm/plex-sans-devanagari": false
  "@ibm/plex-sans-hebrew": false
  "@ibm/plex-sans-thai": false
  "@ibm/plex-sans-thai-looped": false
  "@ibm/plex-serif": false
