    unidade: "%"
    frequencia: mensal
    tipo: taxa
    monetaria: false
    nota_metodologia: Publicada pelo IBGE na tabela 1737, variável 63. Brasil (N1).
  - id: ibge_agregados_1737_2266
    coletor: ipca
    source_id: ibge_agregados
    codigo_externo: "1737/2266"
    nome: IPCA, número-índice (base dez/1993 = 100)
    unidade: número-índice
    frequencia: mensal
    tipo: nivel
    monetaria: false
    nota_metodologia: Publicada pelo IBGE na tabela 1737, variável 2266. Deflator padrão (docs/06).
  - id: bcb_sgs_13522
    coletor: ipca
    source_id: bcb_sgs
    codigo_externo: "13522"
    nome: IPCA, acumulado em 12 meses
    unidade: "%"
    frequencia: mensal
    tipo: taxa
    monetaria: false
    nota_metodologia: Série 13522 do SGS, republicação do IBGE 1737/2265. Usada como reserva.
  - id: bcb_sgs_433
