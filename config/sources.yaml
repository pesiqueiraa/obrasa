  # ---- Economia ----
  - id: bcb_sgs_432
    source_id: bcb_sgs
    codigo_externo: "432"
    nome: Meta da taxa Selic definida pelo Copom
    unidade: "% a.a."
    frequencia: diaria
    tipo: taxa
    monetaria: false
    nota_metodologia: >-
      Série 432 do SGS. Um valor por dia corrido, igual à meta vigente; a meta muda nas
      reuniões do Copom. A fonte publica a meta até a véspera da reunião seguinte, com
      datas futuras: o coletor guarda só até o dia da coleta.
    faixa: [0, 100]
    desde: 1999-03-05
  - id: bcb_sgs_1
    source_id: bcb_sgs
    codigo_externo: "1"
    nome: Dólar comercial, venda (taxa livre)
    unidade: R$/US$
    frequencia: diaria
    tipo: nivel
    monetaria: false
    nota_metodologia: >-
      Série 1 do SGS, um valor por dia útil. O histórico começa em 01/07/1994, início do
      real, para não misturar moedas. É uma taxa de câmbio (reais por dólar), não um valor
      em reais a corrigir pela inflação.
    faixa: [0.5, 20]
    desde: 1994-07-01
