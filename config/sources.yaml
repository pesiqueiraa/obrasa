    nome: Índice de Atividade Econômica do Banco Central (IBC-Br)
    unidade: índice
    frequencia: mensal
    tipo: nivel
    monetaria: false
    nota_metodologia: Série 24363 do SGS, sem ajuste sazonal.
    faixa: [30, 300]
    desde: 2003-01-01
  - id: ibge_agregados_5932_6562
    source_id: ibge_agregados
    codigo_externo: "5932/6562"
    classificacao: "11255[90707]"
    nome: PIB, taxa acumulada em quatro trimestres
    unidade: "%"
    frequencia: trimestral
    tipo: taxa
    monetaria: false
    nota_metodologia: >-
      Tabela 5932, variável 6562, PIB a preços de mercado (classificação 11255, categoria
      90707). Variação do volume dos quatro últimos trimestres sobre os quatro anteriores.
    faixa: [-20, 20]
    calendario: 9300
  - id: ibge_agregados_5932_6564
    source_id: ibge_agregados
    codigo_externo: "5932/6564"
    classificacao: "11255[90707]"
    nome: PIB, taxa contra o trimestre imediatamente anterior
    unidade: "%"
    frequencia: trimestral
    tipo: taxa
    monetaria: false
    nota_metodologia: >-
      Tabela 5932, variável 6564, PIB a preços de mercado (classificação 11255, categoria
      90707). Variação do volume sobre o trimestre anterior, com ajuste sazonal.
    faixa: [-20, 20]
    calendario: 9300

  # ---- Trabalho ----
  - id: ibge_agregados_6381_4099
