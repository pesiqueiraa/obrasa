    faixa: [200, 20000]
    calendario: 9171
  - id: ibge_agregados_8529_12466
    source_id: ibge_agregados
    codigo_externo: "8529/12466"
    nome: Taxa de informalidade das pessoas ocupadas (PNAD Contínua)
    unidade: "%"
    frequencia: trimestral
    tipo: taxa
    monetaria: false
    nota_metodologia: >-
      Tabela 8529, variável 12466. Pela definição do IBGE: empregados e trabalhadores
      domésticos sem carteira, empregadores e conta própria sem CNPJ e trabalhadores
      familiares auxiliares, divididos pelo total de ocupados.
    faixa: [0, 100]
    calendario: 9173

