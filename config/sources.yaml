    unidade: "%"
    frequencia: trimestral_movel
    tipo: taxa
    monetaria: false
    nota_metodologia: >-
      Tabela 6381, variável 4099. Pessoas de 14 anos ou mais que procuravam trabalho e não
      tinham, divididas pela força de trabalho. Trimestre móvel: o período set/2026 é
      jul–set/2026.
    faixa: [0, 40]
    calendario: 9171
  - id: ibge_agregados_6390_5933
    source_id: ibge_agregados
    codigo_externo: "6390/5933"
    nome: Rendimento médio mensal real habitual (PNAD Contínua)
    unidade: R$
    frequencia: trimestral_movel
    tipo: nivel
    monetaria: true
    nota_metodologia: >-
      Tabela 6390, variável 5933. O IBGE expressa toda a série a preços do trimestre móvel
      mais recente; a cada divulgação, os valores reais anteriores mudam e entram como
      revisão.
    faixa: [500, 20000]
    calendario: 9171
  - id: ibge_agregados_6390_5929
    source_id: ibge_agregados
    codigo_externo: "6390/5929"
