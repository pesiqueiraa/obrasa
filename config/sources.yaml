# Fontes e séries registradas. Toda fonte aqui precisa estar descrita em
# docs/05-fontes-de-dados.md antes de entrar neste arquivo.
# O id da série segue o padrão {source_id}_{codigo com "/" trocado por "_"}.
#
# Campos de coleta (pipelines/jobs/series.py):
#   coletor      series (padrão) ou ipca (job próprio, pipelines/jobs/ipca.py)
#   faixa        [mínimo, máximo] plausíveis; valor fora disso faz a coleta ser recusada
#   desde        início do histórico buscado
#   calendario   produto no calendário do IBGE (próxima divulgação)
#   prazo        [meses, dias] para a divulgação do período seguinte, contados do 1º dia
#                do último período, quando a fonte não tem calendário. Sem ele vale o
#                padrão da frequência (mensal: [2, 14]). Passou do prazo, o site mostra
#                "Atrasado desde" e o job `atrasos` falha.
#   classificacao  filtro de categoria do IBGE, ex.: 11255[90707]
# Códigos testados contra a fonte em 01/11/2026 (docs/05).

sources:
