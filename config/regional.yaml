# Mapas por estado (DESIGN.md, "mapa-uf"). Cada mapa lê uma variável do IBGE no nível
# Unidade da Federação (N3), pelo job `regional` (pipelines/jobs/regional.py). Tabelas e
# classificações testadas contra a API em 02/11/2026 (docs/05). `indicador` liga o mapa
# ao número nacional do site; `faixa` recusa valores fora do plausível, como nas séries.

mapas:
  - id: desocupacao-uf
    tema: trabalho
    titulo: Desocupação por estado
    indicador: desocupacao
    tabela: 4099
    variavel: 4099
    na_fonte:
      nome: "Taxa de desocupação, na semana de referência, das pessoas de 14 anos ou mais de idade"
      unidade: "%"
      periodicidade: "trimestral"
    frequencia: trimestral
    periodos: "-20"
    # PNAD Contínua trimestral por UF: o trimestre sai uns 45 dias depois de terminar
    # (2º tri/2026 disponível em 02/11/2026; o 3º, em novembro). [meses, dias] do 1º dia
    # do último trimestre, como `prazo` em config/sources.yaml.
    prazo: [7, 30]
    unidade: "%"
    casas: 1
    faixa: [0, 40]
  - id: analfabetismo-uf
    tema: educacao
    titulo: Analfabetismo por estado, 15 anos ou mais
    indicador: analfabetismo
    tabela: 7113
    variavel: 10267
    na_fonte:
      nome: "Taxa de analfabetismo das pessoas de 15 anos ou mais de idade"
      unidade: "%"
      periodicidade: "anual"
      categorias: ["Total", "15 anos ou mais"]
    classificacao: "2[6794]|58[2795]"
    frequencia: anual
    periodos: "-12"
    unidade: "%"
    casas: 1
    faixa: [0, 40]
  - id: anos-de-estudo-uf
    tema: educacao
    titulo: Anos de estudo por estado, 25 anos ou mais
    indicador: anos-de-estudo
    tabela: 7126
    variavel: 3593
    na_fonte:
      nome: "Número médio de anos de estudo das pessoas de 15 anos ou mais de idade"
      unidade: "Anos"
      periodicidade: "anual"
      categorias: ["Total", "25 anos ou mais"]
    classificacao: "2[6794]|58[108866]"
    frequencia: anual
    periodos: "-12"
    unidade: anos
    casas: 1
    faixa: [0, 20]
