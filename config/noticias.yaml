# Notícias por tema (docs/04, F5; docs/05, "Notícias"). Regra 7 do AGENTS.md: guardamos e
# mostramos só título, link, veículo, data e um trecho curto da descrição do feed. O texto
# da matéria nunca é lido nem guardado.
#
# Critério de inclusão (publicado na página /noticias): veículo de alcance nacional, em
# português, que publica notícias de política, economia ou serviço público do Brasil e
# oferece feed RSS público permitido pelo robots.txt. Não há nota nem rótulo de viés
# (docs/08, D10). A lista fica em ordem alfabética; pedidos de inclusão entram pelo
# "Reportar erro" e passam pelo mesmo critério.
#
# Feeds testados em 02/11/2026: todos responderam 200 com RSS e o robots.txt de cada
# domínio permite o caminho do feed para o agente "oBrasa". Fora da lista por não
# cumprirem o critério nessa data: CNN Brasil (o feed redireciona para um domínio cujo
# robots.txt bloqueia tudo) e Correio Braziliense (o endereço do feed devolve HTML).

trecho_max: 200      # caracteres da descrição do feed, cortados em fim de palavra
janela_dias: 7       # só entram matérias publicadas nos últimos 7 dias

veiculos:
  - id: agencia-brasil
