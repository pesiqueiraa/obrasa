# Só notícias: colunas, editoriais e artigos de opinião ficam de fora (pelo endereço), assim
# como notícias de outros países (pelo título). Vale para todos os temas.
excluir_url: [/opiniao/, /colunas/, /colunistas/, /coluna/, /editorial/, /blogs/, /blog/, /artigos/]
excluir_titulo: [EUA, Estados Unidos, Trump, Biden, midterms, Argentina, Milei, Chile, Venezuela,
                 Colômbia, Peru, Bolívia, Paraguai, Uruguai, México, Portugal, França, Reino Unido,
                 Alemanha, China, Rússia, Ucrânia, Israel, Gaza, Irã, OPEP]

# Tema de cada matéria: termos procurados no título e no trecho, sem diferença de
# maiúsculas nem de acentos, como palavra inteira. Uma matéria pode ter mais de um tema;
# sem nenhum, não é guardada. `excluir` descarta a matéria do tema quando aparece no título.
# Regra pública e sem IA: qualquer pessoa pode conferir por que uma matéria está num tema.
temas:
  eleicoes-2026:
    termos: [TSE, segundo turno, primeiro turno, presidente eleito, governador eleito, governadora eleita,
             senador eleito, senadora eleita, deputado eleito, deputada eleita, eleições 2026,
             eleição de 2026, diplomação, transição de governo, bancada eleita]
    excluir: []
  economia:
    termos: [inflação, IPCA, IPCA-15, IGP-M, Selic, juros, Copom, Banco Central, dólar, câmbio, PIB,
             IBC-Br, Focus, preço da gasolina, preço dos alimentos, cesta básica]
    excluir: []
  trabalho:
    termos: [desemprego, desocupação, desocupados, Caged, PNAD, emprego formal, carteira assinada,
             informalidade, informais, salário mínimo, rendimento médio, mercado de trabalho]
    excluir: []
  contas-publicas:
    termos: [dívida pública, dívida bruta, déficit primário, superávit primário, resultado primário,
             arcabouço fiscal, meta fiscal, Orçamento, LDO, LOA, Tesouro Nacional, contingenciamento,
             bloqueio de gastos, arrecadação federal, Receita Federal, ajuste fiscal, imposto, impostos]
    excluir: []
  impostos:
    termos: [imposto, impostos, tributo, tributos, reforma tributária, imposto de renda, Imposto Seletivo,
             IBS, CBS, isenção do IR, tributação de dividendos, arrecadação federal, split payment]
    excluir: []
  educacao:
    termos: [Enem, Ideb, Inep, Saeb, MEC, Ministério da Educação, ensino médio, ensino fundamental,
             educação infantil, creche, creches, alfabetização, analfabetismo, Fies, ProUni, Sisu,
             universidade federal, universidades federais, escola pública, escolas públicas, professores]
    excluir: []
