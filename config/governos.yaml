# Aba Governos (docs/10, 3.7.1; decisão D27 em docs/08; regras em docs/02, seção 10).
#
# Mandatos: as datas entram aqui à mão e só vão para o banco depois da conferência do job
# `governos`, sem ninguém liberar: cada prova precisa ter o trecho, literalmente, no texto
# citado. Prova `urn` lê o dispositivo no normas.leg.br, na versão `versao` (a que valia na
# posse); prova `url` lê a página do Senado. O fim de um mandato é a véspera do início do
# seguinte (o job confere). Lula 3 fica sem fim até a posse de 2027. O primeiro mandato
# da lista começa sem anterior: não há conferência do fim de quem veio antes.
#
# Dilma 2 e Temer: datas de exercício do cargo. Dilma foi afastada e Temer assumiu em
# 12/05/2016, com a aprovação do Parecer 475/2016 no Senado; o mandato terminou em
# 31/08/2016 com a Resolução do Senado 35/2016 (docs/05, "Senado · página da matéria").

provas_comuns:
  art82: &art82
    urn: "urn:lex:br:federal:constituicao:1988-10-05;1988!art82_cpt"
    versao: "1997-06-04"
    trecho: "terá início em primeiro de janeiro do ano seguinte ao da sua eleição"

mandatos:
