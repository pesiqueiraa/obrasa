    inicio: 2023-01-01
    provas:
      - *art82
      # A posse em 5 de janeiro (Emenda 111/2021) só vale a partir da eleição de 2026.
      - urn: "urn:lex:br:federal:emenda.constitucional:2021-09-28;111!art5_cpt"
        versao: "2021-09-28"
        trecho: "serão aplicadas somente a partir das eleições de 2026"

# Foto: retrato oficial do mandato no Wikimedia Commons (sem retrato próprio, o mais
# recente da pessoa até a posse). O job confere licença e autor no Commons a cada coleta.

# Bloco 1: os mesmos indicadores para todos os mandatos, nesta ordem. `serie` precisa estar
# em config/sources.yaml. `casas`: casas decimais na tela.
#
# Só entram mandatos com todos os indicadores antes da posse e no fim (decisão de
# 08/11/2026, D27): por isso a aba começa em Lula 1 (2003). FHC fica de fora porque
# dívida líquida (desde dez/2001) e resultado primário (desde nov/2002) não cobrem a posse;
# desocupação (PNAD Contínua, desde 2012) e dívida bruta (desde dez/2006) ficam de fora
# porque não cobrem todos os mandatos desde 2003. O site esconde qualquer mandato que fique
# sem um desses pontos (lib/governos.ts), sem trocar de pesquisa para preencher.
indicadores:
  - {id: inflacao, titulo: "Inflação em 12 meses (IPCA)", serie: ibge_agregados_1737_2265, casas: 2}
  - {id: selic, titulo: "Selic efetiva no mês, anualizada", serie: bcb_sgs_4189, casas: 2}
  - {id: pib, titulo: "PIB em quatro trimestres", serie: ibge_agregados_5932_6562, casas: 1}
  - {id: divida-liquida, titulo: "Dívida líquida do setor público", serie: bcb_sgs_4513, casas: 1}
  - {id: resultado-primario, titulo: "Resultado primário do setor público, 12 meses", serie: bcb_sgs_5793, transformacao: inverter_sinal, casas: 2}
  - {id: salario-minimo, titulo: "Salário mínimo", serie: bcb_sgs_1619, casas: 2}
  - {id: dolar, titulo: "Dólar comercial", serie: bcb_sgs_1, casas: 4}

# Bloco 4: todas as emendas à Constituição e leis complementares assinadas durante o
# mandato, da lista de legislação do Senado (job governos confere que a numeração não tem
# buraco). Marca "Impostos" quando a ementa oficial casa com esta expressão (sem
# diferenciar maiúsculas); o oBrasa não escolhe norma a norma.
normas:
  impostos: '\b(tribut\w*|impost\w*|contribuiç\w*|ICMS|ISS|ISSQN|IPI|IBS|CBS|Simples Nacional)\b'
