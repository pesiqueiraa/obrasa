  - slug: lula-3
    presidente: Luiz Inácio Lula da Silva
    rotulo: Lula 3
    plano: {ano: 2022, sq_candidato: "280001607829"}
    foto:
      arquivo: "File:Foto oficial do Presidente da República Luiz Inácio Lula da Silva.jpg"
