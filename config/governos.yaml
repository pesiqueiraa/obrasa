      licenca: "CC BY 3.0 br"
      autor: "Ricardo Stuckert"
    inicio: 2007-01-01
    provas: [*art82]
  - slug: dilma-1
    presidente: Dilma Rousseff
    rotulo: Dilma 1
    plano: {ano: 2010, sq_candidato: "280000000005"}
    foto:
      arquivo: "File:Foto Oficial Presidenta Dilma Rousseff (5766411752).jpg"
      licenca: "CC BY-SA 2.0"
      autor: "Dilma Rousseff from Brasil"
    inicio: 2011-01-01
    provas: [*art82]
  - slug: dilma-2
    presidente: Dilma Rousseff
    rotulo: Dilma 2
    plano: {ano: 2014, sq_candidato: "280000000083"}
    foto:
      # sem retrato próprio do 2º mandato no Commons: vale o mais recente até a posse
      arquivo: "File:Foto Oficial Presidenta Dilma Rousseff (5766411752).jpg"
      licenca: "CC BY-SA 2.0"
      autor: "Dilma Rousseff from Brasil"
    inicio: 2015-01-01
    provas: [*art82]
  - slug: temer
    presidente: Michel Temer
    rotulo: Temer
    sem_plano: "Michel Temer foi eleito vice-presidente em 2014. O plano registrado no TSE naquela eleição é o da chapa encabeçada por Dilma Rousseff."
    ver_plano: dilma-2
    foto:
      arquivo: "File:Michel Temer (foto oficial) (3x4).jpg"
      licenca: "CC BY 2.0"
      autor: "Beto Barata/PR"
    inicio: 2016-05-12
    nota: Exerceu o cargo como presidente interino de 12/05/2016 a 30/08/2016, durante o processo de impeachment, e como presidente a partir de 31/08/2016.
    provas:
      - url: "https://www25.senado.leg.br/web/atividade/materias/-/materia/125567"
        trecho: "12/05/2016 Publicado no DSF Páginas 8-171 Aprovado o Parecer nº 475, de 2016"
      - url: "https://www25.senado.leg.br/web/atividade/materias/-/materia/125567"
        trecho: "para posse ao Excelentíssimo Senhor Michel Temer, como Presidente da República"
      - url: "https://www25.senado.leg.br/web/atividade/materias/-/materia/125567"
        trecho: "Resolução do Senado Federal nº 35 de 31/08/2016"
