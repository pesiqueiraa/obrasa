[project]
name = "brasilado-pipelines"
version = "0.1.0"
description = "Coletores e transformações do oBrasa: dados oficiais do Brasil, com contexto e sem lado."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "defusedxml>=0.7",
  "anthropic>=2.3.0",
  "pdfminer-six>=20260107",
]

[dependency-groups]
backup = [
    "boto3>=1.43.123",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
pythonpath = ["."]
markers = [
  "network: testes que chamam as APIs oficiais (rodar com -m network)",
  "db: testes que precisam do Postgres local (DATABASE_URL)",
]
addopts = "-m 'not network and not db'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: o formatador cuida; RUF00x: textos em português
