name: Cópia de segurança

# Semanal, domingo às 3h de Brasília (6h UTC): dump do banco e respostas brutas novas para
# o Cloudflare R2, fora do Supabase (pipelines/backup.py, docs/06). Cada cópia é testada:
# o dump volta do R2, é restaurado num Postgres vazio e cada tabela precisa ter as linhas
# contadas antes do dump. Falha abre uma issue "Alerta" (scripts/alerta.py).
# A senha "restauro" é do Postgres descartável criado dentro do job, sem dado real.

on:
  schedule:
    - cron: "41 6 * * 0"  # minuto fora do pico (:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Banco e respostas brutas para o R2
    # Agendado só roda com a variável PRODUCAO_ATIVA=true (docs/11); à mão roda sempre.
    if: github.event_name != 'schedule' || vars.PRODUCAO_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: producao
    services:
      restauro:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restauro
        ports: ["55440:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAW_STORE: supabase
      BACKUP_DESTINO: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RESTAURO: postgresql://postgres:restauro@localhost:55440/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group backup
      - name: Conta as linhas e faz o dump
        run: |
          uv run python -m pipelines.backup contagens > contagens.json
          # Tira espaço e quebra de linha do segredo (colado no painel com Enter no fim).
          docker run --rm --network host -v "$PWD:/w" postgres:17 \
            pg_dump "${DATABASE_URL//[$'\r\n' ]/}" -Fc -n public -f /w/banco.dump
      - name: Copia o dump e as respostas brutas novas para o R2
        run: uv run python -m pipelines.backup copiar banco.dump contagens.json
      - name: Restaura a cópia do R2 num Postgres vazio e confere
        run: |
          uv run python -m pipelines.backup baixar-ultimo restaurado.dump manifesto.json
          docker run --rm --network host postgres:17 psql -q "$RESTAURO" -c \
            "drop schema public cascade; create role anon nologin; create role authenticated nologin; create role coletor nologin; create role leitor nologin;"
          docker run --rm --network host -v "$PWD:/w" postgres:17 pg_restore --no-owner \
            --no-privileges --exit-on-error --single-transaction -d "$RESTAURO" /w/restaurado.dump
          RESTAURO_URL="$RESTAURO" uv run python -m pipelines.backup conferir manifesto.json
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/alerta.py backup ${{ job.status }}
