name: Coleta

# Agendamento de docs/06: IBGE e BCB SGS (mensais) diariamente às 10h de Brasília
# (13h UTC). Pega a divulgação no dia em que sai. Uma falha de coleta ou de
# validação faz o job falhar e abre uma issue "Alerta" (scripts/alerta.py), que
# fecha sozinha quando a coleta volta a funcionar.

on:
  schedule:
    # Minuto fora do pico: no :00 o GitHub pode atrasar ou descartar a execução.
    - cron: "7 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  series:
    name: Séries oficiais (IBGE e Banco Central)
    # Agendado só roda com a variável PRODUCAO_ATIVA=true (docs/11); à mão roda sempre.
    if: github.event_name != 'schedule' || vars.PRODUCAO_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: producao
    env:
      # A API do IBGE recusa conexões de fora do Brasil: os pedidos a ela passam pela
      # ponte em São Paulo (apps/web/src/lib/ponte.ts, docs/06). Sem as duas, vai direto.
      IBGE_PONTE_URL: ${{ vars.IBGE_PONTE_URL }}
      IBGE_PONTE_TOKEN: ${{ secrets.IBGE_PONTE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Confere os endpoints contra a fonte
        timeout-minutes: 10
        run: uv run pytest -m network
      # Roda mesmo se a conferência falhar: cada série é coletada e validada sozinha, e
      # uma fonte fora do ar não impede as outras. O job termina com falha e alerta.
      - name: Coleta, valida e grava
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAW_STORE: supabase
        run: uv run python -m pipelines.run todos
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/alerta.py coleta ${{ job.status }} data/agentes/falhas-todos.json
