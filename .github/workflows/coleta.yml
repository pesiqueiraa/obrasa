name: Coleta

# Agendamento de docs/06: IBGE e BCB SGS (mensais) diariamente às 10h de Brasília
# (13h UTC). Pega a divulgação no dia em que sai. Uma falha de coleta ou de
# validação faz o job falhar e abre uma issue "Alerta" (scripts/alerta.py), que
# fecha sozinha quando a coleta volta a funcionar.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  series:
    name: Séries oficiais (IBGE e Banco Central)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Confere os endpoints contra a fonte
        run: uv run pytest -m network
      - name: Coleta, valida e grava
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAW_STORE: supabase
        run: uv run python -m pipelines.run todos
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/alerta.py coleta ${{ job.status }} data/agentes/falhas-todos.json
