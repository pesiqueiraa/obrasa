name: Atrasos

# Verificação de atraso de docs/06: diariamente às 20h de Brasília (23h UTC), depois de
# todas as coletas do dia. Não coleta nada. Se algum indicador ou mapa por estado passou
# do prazo de divulgação sem o período novo no banco, o job falha e o GitHub avisa por
# e-mail quem acompanha o repositório. A mensagem diz qual dado e desde quando.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atrasos
  cancel-in-progress: false

jobs:
  atrasos:
    name: Indicadores dentro do prazo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Confere o prazo de cada indicador
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_STORE: local
        run: uv run python -m pipelines.run atrasos
