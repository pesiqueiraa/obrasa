name: Atrasos

# Verificação de atraso de docs/06: diariamente às 20h de Brasília (23h UTC), depois de
# todas as coletas do dia. Não coleta nada. Se algum indicador ou mapa por estado passou
# do prazo de divulgação sem o período novo no banco, o job falha e abre uma issue
# "Alerta" (scripts/alerta.py), que diz qual dado e desde quando e fecha sozinha quando o
# prazo volta a ser cumprido.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: atrasos
  cancel-in-progress: false

jobs:
  atrasos:
    name: Indicadores dentro do prazo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Confere o prazo de cada indicador
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_STORE: local
        run: uv run python -m pipelines.run atrasos
      - name: Reportes de erro aguardando leitura (issue só com a contagem)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/reportes.py
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/alerta.py atrasos ${{ job.status }} data/agentes/falhas-atrasos.json
