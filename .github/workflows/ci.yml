name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipelines:
    name: Pipelines (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check pipelines scripts
          uv run ruff format --check pipelines scripts
      - name: Testes (inclui acumulado encadeado x publicado pelo IBGE)
        run: uv run pytest

  termos:
    name: Termos proibidos (docs/02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/check_terms.py

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens em dia com o DESIGN.md
        run: pnpm --filter @brasilado/web tokens --check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Testes
        run: pnpm test

  migracoes:
    name: Migrações (Postgres do Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa: "latest" consulta a API do GitHub e falha quando estoura o limite.
          version: 2.121.0
      - name: Aplica as migrações num banco limpo
        run: supabase db start
      - name: Lint do schema
        run: supabase db lint --level warning
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Login local do papel leitor (supabase/seed.sql, idempotente)
        run: psql postgresql://postgres:postgres@127.0.0.1:55322/postgres -f supabase/seed.sql
      - name: Banco recusa alterar dado gravado (triggers, papéis coletor e leitor)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          AGENTES_DATABASE_URL: postgresql://leitor:leitor@127.0.0.1:55322/postgres
        run: uv run pytest -m db
