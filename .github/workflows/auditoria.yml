name: Auditoria

# Auditoria do bruto (docs/06): todo dia às 21h de Brasília (00h UTC), depois das coletas.
# Relê cada resposta bruta citada no banco, confere o SHA-256 gravado na coleta e
# reprocessa com o mesmo parser. Se algum valor do banco não sair igual do bruto, ou se um
# arquivo foi trocado, o job falha e o GitHub avisa por e-mail. Não grava nada.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    name: Banco igual às respostas brutas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Relê as respostas brutas e compara com o banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAW_STORE: supabase
        run: uv run python -m pipelines.run auditar
