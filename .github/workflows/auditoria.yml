name: Auditoria

# Auditoria do bruto (docs/06): todo dia às 21h de Brasília (00h UTC), depois das coletas.
# Relê cada resposta bruta citada no banco, confere o SHA-256 gravado na coleta e
# reprocessa com o mesmo parser. Se algum valor do banco não sair igual do bruto, ou se um
# arquivo foi trocado, o job falha e abre uma issue "Alerta" (scripts/alerta.py).
# Não grava nada.

on:
  schedule:
    - cron: "37 0 * * *"  # minuto fora do pico (:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    name: Banco igual às respostas brutas
    # Agendado só roda com a variável PRODUCAO_ATIVA=true (docs/11); à mão roda sempre.
    if: github.event_name != 'schedule' || vars.PRODUCAO_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Relê as respostas brutas e compara com o banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAW_STORE: supabase
        run: uv run python -m pipelines.run auditar
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTA_IMEDIATO: "1"  # sem esperar a próxima execução (scripts/alerta.py)
        run: uv run python scripts/alerta.py auditoria ${{ job.status }} data/agentes/falhas-auditar.json
