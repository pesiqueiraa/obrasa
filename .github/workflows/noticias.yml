name: Notícias

# Feeds RSS dos veículos de config/noticias.yaml a cada 30 minutos (docs/06 pede 15; 30
# reduz a carga nos sites dos veículos). Só título, link, veículo, data e trecho curto
# (regra 7). A falha de um feed vira erro no relatório e o job falha, mas os demais
# feeds são gravados. A falha abre uma issue "Alerta" (scripts/alerta.py); falhas
# repetidas com os mesmos erros não notificam de novo.

on:
  # O agendador principal é o pg_cron do Supabase (supabase/migrations/20261114000000_agendador.sql),
  # que dispara workflow_dispatch com origem=agendador a cada 30 minutos: o cron do GitHub
  # descartou cerca de 9 em cada 10 horários entre 03/11 e 06/11/2026. Este cron fica como
  # reserva; o `concurrency` abaixo impede duas coletas ao mesmo tempo.
  schedule:
    # Minutos fora do pico (:00 e :30 lotam e o GitHub pode descartar execuções).
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      origem:
        description: "Quem disparou (agendador = pg_cron do Supabase)"
        type: choice
        options: [manual, agendador]
        default: manual

permissions:
  contents: read
  issues: write  # alerta: uma issue aberta enquanto o job falhar (scripts/alerta.py)

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    name: Feeds dos veículos
    # Agendado (cron do GitHub ou agendador do Supabase) só roda com a variável
    # PRODUCAO_ATIVA=true (docs/11); à mão roda sempre.
    if: (github.event_name != 'schedule' && inputs.origem != 'agendador') || vars.PRODUCAO_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Coleta, classifica e grava
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAW_STORE: supabase
        run: uv run python -m pipelines.run noticias
      - name: Alerta (abre, atualiza ou fecha a issue do job)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/alerta.py noticias ${{ job.status }} data/agentes/falhas-noticias.json
